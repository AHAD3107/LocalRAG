services:
  api:
    build: .
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - documents:/app/data/documents
      - index:/app/data/index
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: .
    command: ["python", "frontend/app.py"]
    environment:
      API_URL: http://api:8000
      FRONTEND_PORT: "7860"
    ports:
      - "7860:7860"
    depends_on:
      api:
        condition: service_healthy
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama

volumes:
  documents:
  index:
  ollama:
